[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "markdown2anki"
version = "0.3.0"
description = "Turn Obsidian flashcard notes into Anki cards"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = [
    "Markdown>=3.8,<4",
    "genanki>=0.13.1,<0.14",
    "typer>=0.12,<1",
    "rich>=13,<15",
    "questionary>=2.0,<3",
    "tomli>=2.0; python_version < '3.11'",
]
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Topic :: Education",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
m2a = "markdown2anki.cli:main"

[tool.setuptools.packages.find]
include = ["markdown2anki*"]

[tool.setuptools.package-data]
markdown2anki = ["templates/*.html", "templates/*/*.html", "templates/*/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
